name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: 'tauri.conf.json の version で下書きのリリースを作る（false ならビルドだけ）'
        type: boolean
        default: false

jobs:
  # リリースのタグを決める。空ならビルドだけで、リリースには触らない。
  #   タグの push              → push されたタグ
  #   手動実行（release=false）→ 空
  #   手動実行（release=true） → v<tauri.conf.json の version>
  # release=true のときは、同じタグか同じタグのリリース（下書きを含む）が
  # 既にあればここで落とし、ビルドを始めない。
  prepare:
    runs-on: ubuntu-latest
    permissions:
      # 下書きのリリースは push 権限が無いと一覧に出ない。
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' && inputs.release

      - name: Decide tag
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE: ${{ inputs.release }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "push" ]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$RELEASE" != "true" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(jq -r '.version // empty' src-tauri/tauri.conf.json)
          if [ -z "$version" ]; then
            echo "::error::src-tauri/tauri.conf.json に version がありません"
            exit 1
          fi
          tag="v$version"

          if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "::error::タグ $tag は既にあります。version を上げてから実行してください"
            exit 1
          fi

          found=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$tag\") | .html_url")
          if [ -n "$found" ]; then
            echo "::error::タグ $tag のリリース（下書きを含む）が既にあります: $found"
            exit 1
          fi

          echo "::notice::下書きのリリースを作ります: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
            fixed_name: ImageCrunch_macos_aarch64.dmg
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
            fixed_name: ImageCrunch_macos_x64.dmg
          - platform: windows-latest
            args: ''
            target: ''
            fixed_name: ImageCrunch_windows_x64-setup.exe

    runs-on: ${{ matrix.platform }}
    # 公証の結果待ちで止まったまま走り続けるのを防ぐ。
    # Mac ランナーは Linux の10倍で課金される。
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # バージョンはここに書かない。.node-version を唯一の出どころにする。
          # 以前ここに 20 を固定していたため、ローカルの 22 とずれて
          # jsdom 30 が Node 22 以降の API を要求して CI だけ落ちた。
          node-version-file: '.node-version'

      - name: Install pnpm
        # バージョンはここに書かない。package.json の packageManager を唯一の
        # 出どころにする（ローカルは corepack が同じ値を読む）。
        # 以前はここに 9 を固定していたためローカルの 12 とずれ、
        # pnpm 11 以降の pnpm-workspace.yaml (allowBuilds) を CI が解釈できずに落ちた。
        uses: pnpm/action-setup@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          echo "::group::rustup target"
          rustup target add ${{ matrix.target }}
          echo "::endgroup::"

      - name: Install frontend dependencies
        run: |
          echo "::group::pnpm install"
          pnpm install
          echo "::endgroup::"

      # secrets コンテキストはステップの if: からは参照できない。
      # 後続ステップが分岐できるよう、ここで env に落としておく。
      - name: Detect macOS signing mode
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          if [ "$HAS_CERT" = "true" ]; then
            echo "SIGN_MODE=developer-id" >> "$GITHUB_ENV"
          else
            echo "SIGN_MODE=adhoc" >> "$GITHUB_ENV"
            echo "::warning::APPLE_CERTIFICATE is not set. Falling back to ad-hoc signing (not notarized)."
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS の署名は二段構え。APPLE_CERTIFICATE があれば Developer ID で
          # hardened runtime 付きの署名をし、無ければアドホック署名（'-'）に落ちる。
          # fork からのビルドや証明書の期限切れ・失効でリリース全体が落ちないようにするため。
          # アドホックでも「右クリック → 開く」で起動はできる（警告は出る）。
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && (secrets.APPLE_SIGNING_IDENTITY || '-') || '' }}
          # 公証の資格情報（APPLE_ID など）はここでは渡さない。渡すと tauri-action が
          # 中で notarytool を呼び、結果待ちが止まったときに打ち切れない。
          # 公証は次のステップで、待ち時間と再試行を自分で持って行う。
        with:
          # tagName が空なら tauri-action はビルドだけしてリリースに触らない。
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'Image Crunch ${{ needs.prepare.outputs.tag }}'
          releaseBody: |
            ## Downloads
            - **macOS (Apple Silicon)**: `Image.Crunch_*_aarch64.dmg`
            - **macOS (Intel)**: `Image.Crunch_*_x64.dmg`
            - **Windows**: `Image.Crunch_*_x64-setup.exe` or `.msi`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # .dmg を1回だけ提出し、同じ提出の結果を 15分ずつ最大3回待つ。
      # 提出し直さないのは、Apple 側で処理中のときは列に並び直すだけだから。
      # 45分で終わらなければジョブは落とすが、提出は Apple 側に残るので、
      # ログの受付番号で notarytool info <id> を引けば結果を確かめられる。
      # 同じ提出に中の .app も含まれるので、.app にもチケットを貼れる。
      - name: Notarize
        if: matrix.platform == 'macos-latest' && env.SIGN_MODE == 'developer-id'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          dmg=$(find src-tauri/target -type f -name '*.dmg' -print -quit)
          app=$(find src-tauri/target -type d -name '*.app' -print -quit)
          if [ -z "$dmg" ] || [ -z "$app" ]; then
            echo "::error::.dmg か .app が見つかりません"
            exit 1
          fi

          auth=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
          field() { python3 -c "import sys,json;print(json.load(sys.stdin).get('$1',''))"; }

          echo "提出: $dmg"
          id=$(xcrun notarytool submit "$dmg" "${auth[@]}" --output-format json | field id)
          if [ -z "$id" ]; then
            echo "::error::提出できませんでした（受付番号が返ってこない）"
            exit 1
          fi
          echo "::notice::公証の受付番号: $id"

          status=""
          for attempt in 1 2 3; do
            echo "--- 結果待ち $attempt 回目（最大15分）---"
            # wait は時間切れで非ゼロを返す。そのときは同じ提出を待ち直す。
            xcrun notarytool wait "$id" "${auth[@]}" --timeout 15m || true
            status=$(xcrun notarytool info "$id" "${auth[@]}" --output-format json | field status)
            echo "status=$status"
            case "$status" in
              Accepted) break ;;
              Invalid|Rejected)
                # 待っても直らないので、理由を出して即やめる。
                echo "::error::公証が拒否されました（status=$status）"
                xcrun notarytool log "$id" "${auth[@]}" || true
                exit 1
                ;;
            esac
          done

          if [ "$status" != "Accepted" ]; then
            echo "::error::45分待っても公証が終わりませんでした（status=$status, id=$id）。提出は Apple 側に残っています"
            exit 1
          fi

          xcrun stapler staple "$dmg"
          xcrun stapler staple "$app"

      # 公証が本当に通ったかを確かめる。署名が成功しても公証されていない差は、
      # そのアプリを一度も見たことのない Mac でしか現れないので、CI で確定させる。
      - name: Verify notarization
        if: matrix.platform == 'macos-latest' && env.SIGN_MODE == 'developer-id'
        shell: bash
        run: |
          set -euo pipefail

          app=$(find src-tauri/target -type d -name '*.app' -print -quit)
          if [ -z "$app" ]; then
            echo "::error::No .app bundle found under src-tauri/target"
            exit 1
          fi
          echo "Found: $app"

          echo "--- codesign ---"
          codesign -dv --verbose=4 "$app" 2>&1

          # hardened runtime が付いていないと公証は通らない。
          codesign -dv "$app" 2>&1 | grep -q 'flags=.*runtime' \
            || { echo "::error::Hardened runtime is not enabled"; exit 1; }

          echo "--- stapler ---"
          xcrun stapler validate "$app"

          # 公証済みなら source=Notarized Developer ID になる。
          echo "--- spctl ---"
          spctl -a -vvv -t install "$app"

          dmg=$(find src-tauri/target -type f -name '*.dmg' -print -quit)
          if [ -n "$dmg" ]; then
            echo "--- stapler (dmg) ---"
            xcrun stapler validate "$dmg"
          fi

      # 手動実行ではリリースが無いので、.dmg を成果物として残す。
      # 一度も Image Crunch を開いたことのない Mac で開けるかを人が確かめるため。
      - name: Upload dmg
        if: github.event_name == 'workflow_dispatch' && matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: image-crunch-${{ matrix.target }}-dmg
          path: src-tauri/target/**/*.dmg
          if-no-files-found: error
          retention-days: 7

      # 版に依存しない名前でもう1つ添付する。公開後は
      # https://github.com/<owner>/<repo>/releases/latest/download/<fixed_name>
      # が常に最新を指す（latest は下書きとプレリリースを含まない）。
      # macOS は公証とステープルの後に添付するので、こちらの .dmg はステープル済み。
      - name: Upload installer with a fixed name
        if: needs.prepare.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          FIXED_NAME: ${{ matrix.fixed_name }}
        run: |
          set -euo pipefail

          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            src=$(find src-tauri/target -type f -path '*/bundle/nsis/*-setup.exe' -print -quit)
          else
            src=$(find src-tauri/target -type f -name '*.dmg' -print -quit)
          fi
          if [ -z "$src" ]; then
            echo "::error::添付するインストーラーが見つかりません"
            exit 1
          fi

          dest="$RUNNER_TEMP/$FIXED_NAME"
          cp "$src" "$dest"
          echo "添付: $src → $FIXED_NAME"
          # 再実行で同じ名前が残っていても上書きする。
          gh release upload "$TAG" "$dest" --clobber -R "$GITHUB_REPOSITORY"
