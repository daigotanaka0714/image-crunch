name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # ローカルの pnpm は 12 系。pnpm 11 以降は pnpm-workspace.yaml の
          # allowBuilds を読むため、CI も 12 に揃える（9 だと解釈できない）。
          version: 12

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: |
          echo "::group::pnpm install"
          pnpm install
          echo "::endgroup::"

      - name: Check Biome (format + lint)
        run: |
          echo "::group::biome check"
          pnpm lint
          echo "::endgroup::"

      - name: Check Rust formatting
        run: |
          echo "::group:: cargo fmt"
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          echo "::endgroup::"

      - name: Check TypeScript
        run: |
          echo "::group::Check TypeScript"
          pnpm run build
          echo "::endgroup::"

      # cargo の設定探索はカレントディレクトリ基準なので、
      # --manifest-path ではなく src-tauri に cd してから叩く（bin/agent-check と同じ）。
      - name: Check Rust (clippy)
        working-directory: ./src-tauri
        run: |
          echo "::group::cargo clippy"
          cargo clippy --all-targets -- -D warnings
          echo "::endgroup::"

      - name: Test Rust
        working-directory: ./src-tauri
        run: |
          echo "::group::cargo test"
          cargo test
          echo "::endgroup::"

      - name: Build Tauri app (debug, no bundle)
        run: |
          echo "::group::Build Tauri app (debug)"
          pnpm tauri build --debug --no-bundle
          echo "::endgroup::"
